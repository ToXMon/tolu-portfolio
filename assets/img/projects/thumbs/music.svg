<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#3a2c14" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#1a1408" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0805" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d896"/>
      <stop offset="100%" stop-color="#caa868"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#caa868" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#caa868" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#caa868" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Tile background -->
  <rect x="2" y="2" width="124" height="124" rx="18" fill="url(#bg)" stroke="rgba(255,255,255,0.08)"/>
  <!-- Warm radial glow -->
  <circle cx="64" cy="64" r="60" fill="url(#glow)"/>
  <!-- Top label -->
  <text x="64" y="26" text-anchor="middle" font-family="DM Mono, monospace" font-size="9" font-weight="500" fill="#caa868" opacity="0.65" letter-spacing="0.15em">AUDIUS</text>
  <!-- Sound waves left + right -->
  <g stroke="#caa868" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M22 56 Q16 64 22 72"/>
    <path d="M28 50 Q20 64 28 78"/>
    <path d="M106 56 Q112 64 106 72"/>
    <path d="M100 50 Q108 64 100 78"/>
  </g>
  <!-- Music note (single eighth-note, centered) -->
  <g fill="url(#note)" stroke="#e4b870" stroke-width="0.5">
    <!-- Two note heads + beam connecting them -->
    <ellipse cx="46" cy="92" rx="14" ry="10" transform="rotate(-18 46 92)"/>
    <ellipse cx="82" cy="80" rx="14" ry="10" transform="rotate(-18 82 80)"/>
    <!-- Stems -->
    <path d="M58 88 L58 42 L94 30 L94 76" fill="url(#note)" stroke="none"/>
    <!-- Beam (filled bar connecting stems) -->
    <path d="M58 42 L94 30 L94 40 L58 52 Z" fill="url(#note)" stroke="none"/>
  </g>
  <!-- Tiny dots scattered like sparkles -->
  <g fill="#e4b870" opacity="0.5">
    <circle cx="18" cy="20" r="1.2"/>
    <circle cx="110" cy="22" r="1.2"/>
    <circle cx="112" cy="106" r="1.2"/>
    <circle cx="20" cy="110" r="1.2"/>
    <circle cx="64" cy="116" r="1.2"/>
  </g>
</svg>