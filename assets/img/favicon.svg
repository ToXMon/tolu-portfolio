<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TS monogram">
  <!-- Solid ink background -->
  <rect width="64" height="64" fill="#1c1a17"/>

  <!-- "T" — bold serif-style crossbar + stem -->
  <!-- Crossbar: thick horizontal bar at top -->
  <rect x="8"  y="11" width="22" height="6"  fill="#E8B34B"/>
  <!-- Stem: thick vertical bar -->
  <rect x="15" y="11" width="8"  height="42" fill="#E8B34B"/>

  <!-- "S" — bold stylized S using two thick segments -->
  <!-- Top hook -->
  <path d="M 54 18
           L 38 18
           Q 32 18 32 24
           Q 32 30 38 30
           L 46 30
           Q 54 30 54 38
           Q 54 46 46 46
           L 32 46"
        stroke="#E8B34B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
